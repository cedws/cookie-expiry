name: release

# Push a tag like v1.0.1 (matching manifest.json "version") to build and publish.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write # create the GitHub Release and upload the package
    env:
      WEB_EXT_VERSION: "10.8.0"
      # Optional. When both are set the build is signed by Mozilla (unlisted),
      # which is what makes it installable permanently in release Firefox.
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match manifest version $version" >&2
            exit 1
          fi

      - name: Lint
        run: npx --yes "web-ext@$WEB_EXT_VERSION" lint

      - name: Build unsigned package
        run: npx --yes "web-ext@$WEB_EXT_VERSION" build --overwrite-dest

      - name: Sign with Mozilla (unlisted)
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: npx --yes "web-ext@$WEB_EXT_VERSION" sign --channel=unlisted

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd web-ext-artifacts
          if ls ./*.xpi >/dev/null 2>&1; then
            files=(./*.xpi)
          else
            # Unsigned: loadable via about:debugging, or in Developer/Nightly
            # with xpinstall.signatures.required=false.
            for z in ./*.zip; do mv "$z" "${z%.zip}-unsigned.zip"; done
            files=(./*-unsigned.zip)
          fi
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
